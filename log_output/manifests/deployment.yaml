apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: writer
          image: yashprakashsharma/log-output-writer:1.10
          volumeMounts:
            - name: shared-data
              mountPath: /shared
        - name: reader
          image: yashprakashsharma/log-output-reader:1.11
          env:
            - name: PORT
              value: "3000"
            - name: PONG_FILE
              value: /shared/pingpongs.txt
          volumeMounts:
            - name: shared-data
              mountPath: /shared