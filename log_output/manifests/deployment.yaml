apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-deployment
  labels:
    app: hashgenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      containers:
      - name: hashgenerator
        image: yashprakashsharma/hash-app:latest
