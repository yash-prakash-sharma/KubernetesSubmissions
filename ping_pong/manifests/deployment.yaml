apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-deployment
  labels:
    app: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: ping-pong
          image: yashprakashsharma/ping-pong:1.11
          env:
          - name: PORT
            value: "3000"
          volumeMounts:
            - name: shared-data
              mountPath: /data
