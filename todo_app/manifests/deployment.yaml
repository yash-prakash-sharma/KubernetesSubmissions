apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-deployment
  labels:
    app: todoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: shared-claim
      containers:
      - name: todoapp
        image: yashprakashsharma/todo-app:1.12
        env:
        - name: PORT
          value: "3000"
        - name: IMAGE_DIR
          value: /data/image
        - name: IMAGE_MAX_AGE
          value: "600"
        - name: ENABLE_SHUTDOWN
          value: "true"
        volumeMounts:
          - name: shared-data
            mountPath: /data
